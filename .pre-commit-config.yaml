# pipx install pre-commit && pre-commit install   (una vez)
# pre-commit autoupdate                           (pone al día las versiones)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe] # varios documentos (Kubernetes, Backstage) y !reset (Compose)
        exclude: ^chart/.*/templates/ # plantillas de Helm: no son YAML hasta renderizarlas
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^seguridad/semgrep/ # código vulnerable a propósito: los casos de prueba de semgrep
      - id: ruff-format
        exclude: ^seguridad/semgrep/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
