# Proxy de la pila: /api/ → api, todo lo demás → frontend
server {
    listen 8080;
    server_name _;

    # DNS interno de Docker; re-resolver cada 10 s para ver réplicas nuevas de la API
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    set $web http://frontend:8080;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass $web;
    }
}
