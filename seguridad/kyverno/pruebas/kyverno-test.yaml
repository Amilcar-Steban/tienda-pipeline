# kyverno test seguridad/kyverno/pruebas   (también en el CI: las políticas se prueban como código)
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tienda-cargas-seguras
policies:
  - ../cargas-seguras.yaml
resources:
  - pods.yaml
results:
  - policy: tienda-cargas-seguras
    isValidatingPolicy: true
    resources: [correcto, por-digest]
    kind: Pod
    result: pass
  - policy: tienda-cargas-seguras
    isValidatingPolicy: true
    resources: [registro-ajeno, con-latest, sin-etiqueta, sin-requests]
    kind: Pod
    result: fail
