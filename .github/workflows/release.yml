# Abre y mantiene un PR de release a partir de los Conventional Commits; al fusionarlo crea la etiqueta vX.Y.Z.
# Para que esa etiqueta dispare "Imagen", usa el token de una GitHub App (ver PIPELINE.md):
# los eventos creados con GITHUB_TOKEN no disparan otros workflows.
name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Con el token de la App, la etiqueta vX.Y.Z que crea release-please sí dispara "Imagen".
      # Sin App configurada, se usa GITHUB_TOKEN (y la imagen versionada no se publica).
      - id: token
        if: vars.GITOPS_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
