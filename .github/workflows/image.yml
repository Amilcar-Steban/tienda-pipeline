# Construye, escanea, publica, firma y atesta las imágenes en cada push a main y en cada etiqueta v*.
# Desde main, además, despliega en staging y (tras aprobación) en producción con deploy.yml.
name: Imagen

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  imagen:
    name: imagen (${{ matrix.servicio }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        servicio: [api, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nombre de la imagen en minúsculas
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICIO: ${{ matrix.servicio }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/tienda-${SERVICIO}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # 1) Build local (amd64) para escanear ANTES de publicar nada
      - name: Build para escaneo
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.servicio }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:escaneo
          cache-from: type=gha,scope=${{ matrix.servicio }}

      - name: Trivy (bloquea vulnerabilidades críticas con parche)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:escaneo
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # 2) Build multiarquitectura y push (reutiliza la caché del paso anterior)
      - name: Build y push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.servicio }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          sbom: true
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

      # 3) Procedencia firmada (SLSA): quién, desde qué repo y commit se construyó
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # 4) Firma keyless (Sigstore) y SBOM firmado: lo que verifica Kyverno antes de ejecutar (Fase 8)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Firmar la imagen por digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: SBOM CycloneDX de la imagen publicada
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Adjuntar el SBOM como atestación firmada
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${DIGEST}"

  # GitOps (Fase 6): cada imagen de main pasa a dev; cada release (vX.Y.Z) abre un PR para prod en
  # tienda-gitops. Solo si la GitHub App está configurada (variable GITOPS_APP_ID y secreto GITOPS_APP_KEY).
  promover:
    if: vars.GITOPS_APP_ID != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: imagen
    permissions:
      contents: read
    uses: ./.github/workflows/promover.yml
    secrets:
      GITOPS_APP_KEY: ${{ secrets.GITOPS_APP_KEY }}

  # Despliegue automático: solo desde main y cuando el despliegue está configurado
  # (variable del repositorio DEPLOY_ENABLED=true, ver PIPELINE.md). Las etiquetas v* se despliegan a mano.
  staging:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: imagen
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      entorno: staging
      version: ${{ github.sha }}

  produccion:
    needs: staging
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      entorno: produccion
      version: ${{ github.sha }}
